<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#faf7f2" />
  <!-- Theme must be decided BEFORE the stylesheet paints: initTheme() lives in
       the JS bundle, which arrives after first paint — without this, every
       dark-mode load flashes white. Kept in sync with lib/theme.ts. -->
  <script>
    (function () {
      var t = localStorage.getItem('coldreach-theme');
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) {
        document.documentElement.dataset.theme = 'dark';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#151210');
      }
    })();
  </script>
  <title>ColdReach — Cold-email recruiters &amp; hiring managers from your Gmail</title>
  <meta name="description" content="ColdReach finds decision-makers at companies hiring right now, writes cold emails grounded in your résumé, and sends them from your own Gmail. Skip the ATS black hole." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://coldreach-niyp.vercel.app/" />
  <!-- Open Graph (link previews on Slack, LinkedIn, WhatsApp, iMessage) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ColdReach" />
  <meta property="og:title" content="ColdReach — Email the people hiring, not the ATS black hole" />
  <meta property="og:description" content="Find decision-makers at companies hiring right now, write emails grounded in your résumé, and send from your own Gmail — with reply tracking built in." />
  <meta property="og:url" content="https://coldreach-niyp.vercel.app/" />
  <meta property="og:image" content="https://coldreach-niyp.vercel.app/favicon.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="ColdReach — Email the people hiring, not the ATS black hole" />
  <meta name="twitter:description" content="Find decision-makers at companies hiring right now, write emails grounded in your résumé, and send from your own Gmail." />
  <meta name="twitter:image" content="https://coldreach-niyp.vercel.app/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-render-blocking: start the fetch early (preload), apply via media="print"
       then swap to all onload, so the third-party font CSS never blocks first
       paint (display=swap covers the brief fallback-font flash). -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  </noscript>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
